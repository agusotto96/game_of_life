<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game of Life</title>
    <style>
        html {
            width: 100%;
            height: 100%;
        }
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100dvh;
            background-color: #202020;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-family: sans-serif;
            overflow: hidden;
        }
        canvas {
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
            image-rendering: pixelated;
        }
    </style>
</head>
<body>
    <script src="wasm_exec.js"></script>
    <script>
        if (!WebAssembly.instantiateStreaming) {
            WebAssembly.instantiateStreaming = async (resp, importObject) => {
                const source = await (await resp).arrayBuffer();
                return await WebAssembly.instantiate(source, importObject);
            };
        }
        const go = new Go();
        const urlParams = new URLSearchParams(window.location.search);

        // Adaptive cell size based on screen size:
        // Desktop (>= 1200px): cellSize = 2 for high density and fine detail (~960px width)
        // Tablets (768px - 1199px): cellSize = 3 balanced
        // Mobile (< 768px): cellSize = 4 for smooth 60 FPS and comfortable physical visibility
        let defaultCellSize = 2;
        if (window.innerWidth < 768) {
            defaultCellSize = 4;
        } else if (window.innerWidth < 1200) {
            defaultCellSize = 3;
        }

        const customCellSize = parseInt(urlParams.get("cell_size") || urlParams.get("cellSize"), 10);
        const cellSize = (!isNaN(customCellSize) && customCellSize > 0) ? customCellSize : defaultCellSize;
        urlParams.delete("cell_size");
        urlParams.delete("cellSize");

        // Calculate dynamic dimensions from viewport if not explicitly specified
        const parsedWidth = parseInt(urlParams.get("width"), 10);
        const hasExplicitWidth = !isNaN(parsedWidth) && parsedWidth > 0;

        const parsedHeight = parseInt(urlParams.get("height"), 10);
        const hasExplicitHeight = !isNaN(parsedHeight) && parsedHeight > 0;

        if (!hasExplicitWidth) {
            const autoWidth = Math.max(1, Math.floor(window.innerWidth / cellSize));
            urlParams.set("width", autoWidth.toString());
        }
        if (!hasExplicitHeight) {
            const autoHeight = Math.max(1, Math.floor(window.innerHeight / cellSize));
            urlParams.set("height", autoHeight.toString());
        }

        const args = ["game"];
        for (const [key, value] of urlParams.entries()) {
            args.push(`-${key}`);
            args.push(value);
        }
        go.argv = args;

        WebAssembly.instantiateStreaming(fetch("game.wasm"), go.importObject).then((result) => {
            go.run(result.instance);
        }).catch((err) => {
            console.error("Failed to initialize WebAssembly:", err);
        });
    </script>
</body>
</html>
