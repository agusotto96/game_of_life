<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game of Life</title>
    <style>
        html {
            width: 100%;
            height: 100%;
        }
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100dvh;
            background-color: #202020;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-family: sans-serif;
            overflow: hidden;
        }
        canvas {
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
            image-rendering: pixelated;
        }
    </style>
</head>
<body>
    <script src="wasm_exec.js"></script>
    <script>
        if (!WebAssembly.instantiateStreaming) {
            WebAssembly.instantiateStreaming = async (resp, importObject) => {
                const source = await (await resp).arrayBuffer();
                return await WebAssembly.instantiate(source, importObject);
            };
        }
        const go = new Go();
        const urlParams = new URLSearchParams(window.location.search);

        // Adaptive cell size based on screen size:
        // Desktop (>= 1200px): cellSize = 2
        // Tablets (768px - 1199px): cellSize = 3
        // Mobile (< 768px): cellSize = 4
        let defaultCellSize = 2;
        if (window.innerWidth < 768) {
            defaultCellSize = 4;
        } else if (window.innerWidth < 1200) {
            defaultCellSize = 3;
        }

        const customCellSize = parseInt(urlParams.get("cell-size"), 10);
        const cellSize = (!isNaN(customCellSize) && customCellSize > 0) ? customCellSize : defaultCellSize;
        urlParams.set("cell-size", cellSize.toString());

        // Default window dimensions to viewport if not explicitly specified in URL
        if (!urlParams.has("width") || parseInt(urlParams.get("width"), 10) <= 0) {
            urlParams.set("width", Math.max(1, Math.floor(window.innerWidth)).toString());
        }
        if (!urlParams.has("height") || parseInt(urlParams.get("height"), 10) <= 0) {
            urlParams.set("height", Math.max(1, Math.floor(window.innerHeight)).toString());
        }

        const args = ["game"];
        for (const [key, value] of urlParams.entries()) {
            args.push(`-${key}`);
            args.push(value);
        }
        go.argv = args;

        WebAssembly.instantiateStreaming(fetch("game.wasm"), go.importObject).then((result) => {
            go.run(result.instance);
        }).catch((err) => {
            console.error("Failed to initialize WebAssembly:", err);
        });
    </script>
</body>
</html>
